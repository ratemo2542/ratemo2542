<svg xmlns="http://www.w3.org/2000/svg" width="150" height="40" viewBox="0 0 150 40">
  <rect width="150" height="40" rx="7" fill="#20232a"/>
  <g transform="translate(22 20)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="3s" repeatCount="indefinite"/>
      <g fill="none" stroke="#61dafb" stroke-width="1.8">
        <ellipse rx="13" ry="5.2"/>
        <ellipse rx="13" ry="5.2" transform="rotate(60)"/>
        <ellipse rx="13" ry="5.2" transform="rotate(120)"/>
      </g>
    </g>
    <circle r="2.4" fill="#61dafb"/>
  </g>
  <text x="45" y="25" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="600">React</text>
</svg>